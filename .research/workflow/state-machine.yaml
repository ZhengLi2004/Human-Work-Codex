schema_version: 4
rule_set_version: 8
name: research-task-lifecycle

purpose: >-
  Prepare evidence-backed lifecycle choices at each stage boundary and begin an
  explicitly confirmed target in the same operation.

state_file:
  template: .research/templates/task-state.yaml
  default_path_pattern: "{todo_id}/task-state.yaml"
  atomic_write_required: true
  revision_check_required: true
  todo_sha256_fingerprint_required: true

truth_model:
  values:
    - true
    - false
    - unknown

  non_self_rule:
    all: every predicate is true
    any: at least one predicate is true when present
    none: every predicate is false
    unknown_result: ineligible

  self_rule:
    required_for_every_state: true
    eligibility: always

human_control:
  explicit_rule_path_confirmation_required: true
  confirmation_authorizes_target_execution: true
  selected_path_must_be_eligible: true
  target_only_requires_one_matching_rule: true
  experimentally_selected_parameter_requires_approval: true

decision_protocol:
  todo_ready_initialization_resolves_and_prepares_decision: true
  separate_evaluate_stage: false
  stage_boundary_prepares_decision: true
  recommendation_count: 1
  prefer_self_when_material_evidence_is_unknown: true
  preserve_decision_snapshot_in_history: true

migrations:
  - from_rule_set_version: 7
    to_rule_set_version: 8
    state_map: {}
    preserve_execution_evidence: true
    invalidate_pending_review: true
    invalidate_predicate_results:
      - todo_definition_complete
      - pilot_scope_defined
      - figure_integrity_audit_passed
    reason: Problem-led framework validation and evidence-based thumbnail inspection clarify readiness and integrity requirements.

  - from_rule_set_version: 6
    to_rule_set_version: 7
    state_map: {}
    preserve_execution_evidence: true
    invalidate_pending_review: true
    invalidate_predicate_results:
      - todo_definition_complete
      - confirmation_prerequisites_ready
      - results_ready_for_figures
      - figure_integrity_audit_passed
    reason: Statistical design and reporting evidence now contributes to these predicates.

  - from_rule_set_version: 5
    to_rule_set_version: 6

    state_map:
      exploration: todo_ready

    preserve_execution_evidence: true
    invalidate_pending_review: true

todo_change_control:
  before_governed_figures_presented:
    approved_scientific_revision: synchronize_in_place

  after_governed_figures_presented:
    approved_scientific_revision: create_versioned_todo_from_current_implementation

  path_only_revision: synchronize_in_place
  synchronized_change_increments_revision: true
  synchronized_change_refreshes_fingerprint: true
  synchronized_change_invalidates_pending_decision: true

states:
  todo_ready:
    executor: codex_resolution_and_decision_preparation
    purpose: Validate the TODO, resolve bounded mappings, semantics, and feasibility, then present eligible stages.

  development:
    executor: codex
    skill: skills/research-development/SKILL.md

  pilot:
    executor: codex
    skill: skills/research-pilot/SKILL.md

  confirmation:
    executor: codex
    skill: skills/research-confirmation/SKILL.md

  ablation_diagnosis:
    executor: codex
    skill: skills/research-ablation-diagnosis/SKILL.md

  figure_review:
    executor: codex_with_researcher_feedback

    skills:
      - skills/research-figure-production/SKILL.md
      - skills/human-research-review-gate/SKILL.md

  figure_production:
    executor: codex
    skill: skills/research-figure-production/SKILL.md

  completed:
    executor: none
    terminal: true

  stopped:
    executor: none
    terminal: true

predicate_catalog:
  todo_definition_complete: TODO defines the core problem, primary criteria, justified guardrails, and applicable framework-validation criteria before refinement, plus approved statistical design and sample-size rationale or a reason inference is outside scope.
  current_scope_executed: The current approved stage scope reached its boundary.
  no_critical_correctness_risk: No unresolved correctness risk blocks progress.
  no_scope_change_required: Progress does not require an unapproved semantic change.
  todo_ready_questions_unresolved: Required project mapping, data meaning, or feasibility remains unresolved.
  todo_ready_questions_resolved: Required project mapping, data meaning, and feasibility are resolved.
  implementation_work_needed: The TODO requires implementation or material correction.
  existing_implementation_pilot_ready: Existing code and tests support Pilot entry.
  implementation_scaffold_validated: The runnable vertical slice passed its checks.
  implementation_matches_todo: Correctness evidence supports the TODO implementation.
  performance_optimization_complete: Representative medium-scale profiling is complete.
  risk_matched_tests_sufficient: Tests cover the material implementation risks.
  smoke_test_passed: One representative combination and repeat completed correctly.
  pilot_scope_defined: Pilot combinations, repeats, metrics, and controls are complete; method-development work separates framework validation from refinement, with an evidence-based criterion for proceeding or reconsidering the framework.
  pilot_grid_complete: Every Pilot combination has an accounted-for state.
  pilot_evidence_supports_confirmation: Pilot evidence supports the frozen Confirmation plan.
  confirmation_spec_frozen: Confirmation definitions and configuration are fixed.
  verified_parameters_recorded: Approved experimentally selected values are in the TODO.
  required_parameter_sensitivity_complete: Every applicable nonstandard parameter has sensitivity evidence.
  confirmation_prerequisites_ready: Frozen design, implementation, tests, and data are ready, including approved applicable statistical definitions and stopping rules.
  implementation_rework_needed: A reproducible implementation defect requires Development.
  bounded_diagnosis_needed: A bounded approved diagnosis is needed.
  diagnostic_scope_ready: Diagnosis variables, controls, and decision rule are complete.
  diagnosis_supports_development: Diagnosis identifies Development work.
  diagnosis_supports_pilot: Diagnosis supports a revised Pilot.
  diagnosis_supports_confirmation: Diagnosis supports Confirmation.
  formal_evidence_complete: The complete valid Confirmation evidence exists.
  formal_run_invalidated: A documented defect invalidates the formal run.
  todo_completion_evidence_satisfied: Technical completion criteria are satisfied.
  results_ready_for_figures: Complete validated results can support figure review; aggregation validation includes passing applicable statistical checks or a justified not-applicable determination.
  curated_tables_complete: Presentation tables preserve rows and stable keys.
  figure_plan_complete: The plan maps all applicable scientific information.
  figure_method_basis_recorded: Each graphical method has a recorded basis.
  draft_figures_complete: Dedicated Python scripts generated the complete draft set.
  figure_source_coverage_complete: Every applicable source condition is accounted for.
  sensitivity_figures_complete: Applicable parameter sensitivity results are plotted, or none apply.
  figures_presented: Governed draft figures were presented to the researcher.
  figure_recommendations_recorded: Researcher feedback is recorded by reference.
  figure_recommendations_within_scope: Feedback can be implemented without unapproved semantic change.
  figure_review_clarification_needed: Figure feedback needs researcher clarification.
  figure_plan_revision_needed: The draft mapping or coverage needs another review pass.
  final_figures_complete: Final figures implement the recorded feedback.
  figure_outputs_traceable: Scripts, sources, hashes, exports, and manifests are linked.
  figure_integrity_audit_passed: Final coverage, meaning, rendering, and applicable statistical checks pass with traceable evidence. Visual inspection uses thumbnails only when needed; unresolved integrity or readability findings prevent a pass.
  misleading_figure_risk_found: A final figure could mislead or omit required context.
  computation_output_defect_found: Figure review exposed a computation or aggregation defect.
  formal_output_gap_found: Figure review exposed a gap in formal evidence.
  figure_revision_needed: Final figures require another figure-stage pass.
  stop_warranted: Evidence or researcher intent supports stopping.

rules:
  - id: todo_ready.self
    from: todo_ready
    to: todo_ready
    kind: self

  - id: todo_ready.to_development
    from: todo_ready
    to: development
    kind: forward
    all: [todo_definition_complete, todo_ready_questions_resolved, implementation_work_needed]
    none: [todo_ready_questions_unresolved]

  - id: todo_ready.to_pilot
    from: todo_ready
    to: pilot
    kind: forward
    all: [todo_definition_complete, todo_ready_questions_resolved, existing_implementation_pilot_ready, pilot_scope_defined]
    none: [todo_ready_questions_unresolved, implementation_work_needed]

  - id: todo_ready.to_confirmation
    from: todo_ready
    to: confirmation
    kind: forward
    all: [todo_definition_complete, todo_ready_questions_resolved, required_parameter_sensitivity_complete, confirmation_prerequisites_ready]

  - id: todo_ready.to_ablation_diagnosis
    from: todo_ready
    to: ablation_diagnosis
    kind: forward
    all: [todo_definition_complete, todo_ready_questions_resolved, diagnostic_scope_ready]

  - id: todo_ready.to_figure_review
    from: todo_ready
    to: figure_review
    kind: forward
    all: [todo_definition_complete, todo_ready_questions_resolved, required_parameter_sensitivity_complete, results_ready_for_figures]

  - id: todo_ready.to_stopped
    from: todo_ready
    to: stopped
    kind: terminal
    all: [stop_warranted]

  - id: development.self
    from: development
    to: development
    kind: self

  - id: development.to_todo_ready
    from: development
    to: todo_ready
    kind: backward
    all: [todo_ready_questions_unresolved]

  - id: development.to_pilot
    from: development
    to: pilot
    kind: forward
    all: [implementation_scaffold_validated, implementation_matches_todo, performance_optimization_complete, risk_matched_tests_sufficient, smoke_test_passed, pilot_scope_defined, no_critical_correctness_risk, no_scope_change_required]

  - id: development.to_figure_review
    from: development
    to: figure_review
    kind: forward
    all: [current_scope_executed, required_parameter_sensitivity_complete, results_ready_for_figures, todo_completion_evidence_satisfied, no_critical_correctness_risk]

  - id: development.to_stopped
    from: development
    to: stopped
    kind: terminal
    all: [stop_warranted]

  - id: pilot.self
    from: pilot
    to: pilot
    kind: self

  - id: pilot.to_development
    from: pilot
    to: development
    kind: backward
    all: [implementation_rework_needed]

  - id: pilot.to_ablation_diagnosis
    from: pilot
    to: ablation_diagnosis
    kind: lateral
    all: [bounded_diagnosis_needed, diagnostic_scope_ready]

  - id: pilot.to_confirmation
    from: pilot
    to: confirmation
    kind: forward
    all: [pilot_grid_complete, pilot_evidence_supports_confirmation, confirmation_spec_frozen, verified_parameters_recorded, required_parameter_sensitivity_complete, confirmation_prerequisites_ready]

  - id: pilot.to_figure_review
    from: pilot
    to: figure_review
    kind: forward
    all: [pilot_grid_complete, required_parameter_sensitivity_complete, results_ready_for_figures, todo_completion_evidence_satisfied]

  - id: pilot.to_stopped
    from: pilot
    to: stopped
    kind: terminal
    all: [stop_warranted]

  - id: confirmation.self
    from: confirmation
    to: confirmation
    kind: self

  - id: confirmation.to_development
    from: confirmation
    to: development
    kind: backward
    any: [formal_run_invalidated, implementation_rework_needed]

  - id: confirmation.to_ablation_diagnosis
    from: confirmation
    to: ablation_diagnosis
    kind: lateral
    all: [bounded_diagnosis_needed, diagnostic_scope_ready]

  - id: confirmation.to_figure_review
    from: confirmation
    to: figure_review
    kind: forward
    all: [formal_evidence_complete, required_parameter_sensitivity_complete, results_ready_for_figures]
    none: [formal_run_invalidated]

  - id: confirmation.to_stopped
    from: confirmation
    to: stopped
    kind: terminal
    all: [stop_warranted]

  - id: ablation_diagnosis.self
    from: ablation_diagnosis
    to: ablation_diagnosis
    kind: self

  - id: ablation_diagnosis.to_development
    from: ablation_diagnosis
    to: development
    kind: backward
    all: [diagnosis_supports_development]

  - id: ablation_diagnosis.to_pilot
    from: ablation_diagnosis
    to: pilot
    kind: backward
    all: [diagnosis_supports_pilot]

  - id: ablation_diagnosis.to_confirmation
    from: ablation_diagnosis
    to: confirmation
    kind: forward
    all: [diagnosis_supports_confirmation, confirmation_prerequisites_ready]

  - id: ablation_diagnosis.to_figure_review
    from: ablation_diagnosis
    to: figure_review
    kind: forward
    all: [current_scope_executed, required_parameter_sensitivity_complete, results_ready_for_figures, todo_completion_evidence_satisfied]

  - id: ablation_diagnosis.to_stopped
    from: ablation_diagnosis
    to: stopped
    kind: terminal
    all: [stop_warranted]

  - id: figure_review.self
    from: figure_review
    to: figure_review
    kind: self

  - id: figure_review.to_development
    from: figure_review
    to: development
    kind: backward
    any: [computation_output_defect_found, implementation_rework_needed]

  - id: figure_review.to_confirmation
    from: figure_review
    to: confirmation
    kind: backward
    all: [formal_output_gap_found, confirmation_prerequisites_ready]

  - id: figure_review.to_ablation_diagnosis
    from: figure_review
    to: ablation_diagnosis
    kind: backward
    all: [bounded_diagnosis_needed, diagnostic_scope_ready]

  - id: figure_review.to_figure_production
    from: figure_review
    to: figure_production
    kind: forward
    all: [curated_tables_complete, figure_plan_complete, figure_method_basis_recorded, draft_figures_complete, figure_source_coverage_complete, sensitivity_figures_complete, figures_presented, figure_recommendations_recorded, figure_recommendations_within_scope]
    none: [figure_review_clarification_needed, figure_plan_revision_needed]

  - id: figure_review.to_stopped
    from: figure_review
    to: stopped
    kind: terminal
    all: [stop_warranted]

  - id: figure_production.self
    from: figure_production
    to: figure_production
    kind: self

  - id: figure_production.to_figure_review
    from: figure_production
    to: figure_review
    kind: backward
    any: [figure_plan_revision_needed, figure_revision_needed, misleading_figure_risk_found]

  - id: figure_production.to_development
    from: figure_production
    to: development
    kind: backward
    any: [computation_output_defect_found, implementation_rework_needed]

  - id: figure_production.to_confirmation
    from: figure_production
    to: confirmation
    kind: backward
    all: [formal_output_gap_found, confirmation_prerequisites_ready]

  - id: figure_production.to_ablation_diagnosis
    from: figure_production
    to: ablation_diagnosis
    kind: backward
    all: [bounded_diagnosis_needed, diagnostic_scope_ready]

  - id: figure_production.to_completed
    from: figure_production
    to: completed
    kind: terminal
    all: [final_figures_complete, figure_outputs_traceable, figure_source_coverage_complete, sensitivity_figures_complete, figure_integrity_audit_passed, todo_completion_evidence_satisfied]
    none: [misleading_figure_risk_found, figure_revision_needed]

  - id: figure_production.to_stopped
    from: figure_production
    to: stopped
    kind: terminal
    all: [stop_warranted]

  - id: completed.self
    from: completed
    to: completed
    kind: self

  - id: stopped.self
    from: stopped
    to: stopped
    kind: self
