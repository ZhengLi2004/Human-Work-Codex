schema_version: 12
name: research-task-system

purpose: >-
  Run one TODO-defined research task in a shared Codex context, preserve
  machine lifecycle evidence, and obtain explicit researcher decisions.

roles:
  human_researcher:
    owns:
      - scientific_question_hypothesis_and_design
      - scientific_semantic_changes
      - experimentally_supported_parameter_selection
      - lifecycle_rule_path_confirmation
      - scripts_with_estimated_minimum_runtime_over_three_hours
      - figure_feedback_and_scientific_interpretation
      - completion_stop_redesign_or_new_todo_decision

  codex:
    shared_context: true

    owns:
      - todo_authoring_and_governed_revision
      - task_state_and_lifecycle_decisions
      - implementation_testing_and_short_execution
      - aggregation_and_table_curation
      - draft_figure_planning_rendering_and_presentation
      - final_figure_production_and_integrity_audit
      - technical_evidence_and_output_path_updates

artifacts:
  todo:
    template: .research/templates/TODO.md
    path_pattern: "{todo_id}/TODO.md"
    role: only_scientific_handoff
    math_format: one_line_single_dollar_delimiters
    current_actions_only: true

  task_state:
    template: .research/templates/task-state.yaml
    default_path_pattern: "{todo_id}/task-state.yaml"
    role: machine_control

  task_directory:
    pattern: ^TODO_[0-9]{3}$

    directories:
      code: optional_reusable_method_or_framework_code
      exp: required_experiment_and_measurement_code
      data: required_experimental_inputs_outputs_and_artifacts

todo_change_control:
  before_governed_figures_presented:
    approved_scientific_change: edit_current_todo_in_place
    synchronize_fingerprint_and_revision: true

  after_governed_figures_presented:
    approved_scientific_change: create_versioned_todo
    reuse_current_code_data_and_artifacts: true

  output_path_change:
    edit_current_todo_in_place: true

  debug_in_development_pilot_confirmation:
    update_code_and_data_in_current_task_directory: true
    remove_proven_invalid_artifacts_with_recorded_reason_and_ids: true
    regenerate_dependent_outputs: true

routing:
  entry: skills/research-task-router/SKILL.md
  todo_authoring: skills/research-report-to-todos/SKILL.md
  lifecycle: skills/research-state-transition/SKILL.md
  figures: skills/research-figure-production/SKILL.md
  statistics: skills/research-statistical-analysis/SKILL.md
  human_gate: skills/human-research-review-gate/SKILL.md
  post_report: skills/post-report-assessment/SKILL.md

  initial_rule: >-
    Initialize todo_ready, resolve bounded mapping, semantic, and feasibility
    questions, then prepare every eligible initial rule including self.

  boundary_rule: >-
    Stage execution records predicate evidence and prepares all outgoing rules
    before asking the researcher to select one.

  confirmation_rule: >-
    A confirmed eligible transition is applied atomically and its target begins
    immediately; terminal targets only update state.

state_definitions:
  todo_ready:
    purpose: Validate the TODO, resolve bounded project and data questions, and present eligible stages.

  development:
    skill: skills/research-development/SKILL.md
    purpose: Make the implementation work, right, and fast using representative benchmarks.

  pilot:
    skill: skills/research-pilot/SKILL.md
    purpose: Validate the framework on primary criteria before refinement; account for the complete approved scope and sensitivities.

  confirmation:
    skill: skills/research-confirmation/SKILL.md
    purpose: Execute the frozen confirmatory specification and preserve complete evidence.

  ablation_diagnosis:
    skill: skills/research-ablation-diagnosis/SKILL.md
    purpose: Resolve a bounded component contribution or failure cause.

  figure_review:
    purpose: Curate tables, render complete drafts from Python scripts, present them, and record researcher feedback.

    ordered_skills:
      - skills/research-figure-production/SKILL.md
      - skills/human-research-review-gate/SKILL.md

  figure_production:
    skill: skills/research-figure-production/SKILL.md
    purpose: Implement researcher feedback and pass the final figure audit.

  completed:
    purpose: Preserve a human-confirmed completed task.

  stopped:
    purpose: Preserve a human-confirmed stop decision.

execution_protocol:
  - Resolve the scientific specification, lifecycle identity, and current authorization before acting.
  - Carry the authorized stage to its boundary, choosing implementation details and relevant Skills from the task and its material risks.
  - Use AGENTS.md for shared boundaries, policy for limits, and capability references for artifact contracts; reuse valid evidence instead of repeating unchanged work.
  - Apply statistical design and reporting requirements when the task estimates uncertainty or makes inferential claims; keep scientific decisions in the TODO.
  - Record evidence and prepare every outgoing rule including self, with one recommendation. Apply an approved path atomically and begin its target.

figure_protocol:
  - Enter figure_review when validated complete results are ready.
  - Curate presentation tables without changing rows or stable keys.
  - Map every applicable metric, condition, coverage state, and parameter sensitivity to the draft set.
  - Render drafts from a dedicated Python script under exp/figures, separate from computation code.
  - Use SciencePlots with science plus no-latex by default and record script, input, and output hashes.
  - Present every draft and coverage summary and wait for researcher feedback in the same state.
  - Record when governed figures were first presented; later scientific TODO changes use a versioned TODO based on the current implementation.
  - Store figure exports and audits under data/figures; enter figure_production after the researcher confirms its rule path.

communication_contract:
  - Use established technical terms and direct sentences.
  - Separate facts, interpretation, predicate judgments, and recommendations.
  - Tie evaluative claims to TODO-defined criteria and evidence.
  - Use examples only when they clarify a fragile boundary.
