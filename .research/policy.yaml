schema_version: 11
name: research-task-system-policy

routing:
  implicit_entry_skill: research-task-router
  task_source_of_truth: todo
  active_state_source: task_state_yaml
  todo_id_pattern: ^TODO_[0-9]{3}$
  todo_path_pattern: "{todo_id}/TODO.md"
  task_state_path_pattern: "{todo_id}/task-state.yaml"
  state_machine: .research/workflow/state-machine.yaml
  initialize_missing_state_as: todo_ready
  initialize_and_prepare_initial_decision_together: true
  todo_ready_includes_bounded_mapping_semantics_and_feasibility: true
  one_shared_codex_context_for_all_agent_stages: true
  separate_scientific_handoff_documents_forbidden: true

task_layout:
  root_pattern: "{todo_id}"

  root_files:
    todo: TODO.md
    task_state: task-state.yaml

  directories:
    code:
      required: false
      role: reusable_method_or_framework_code
      google_style_python_docstrings: true
      matlab_function_help_comments: true
      code_smells_avoided: true

    exp:
      required: true
      role: experiment_and_measurement_code
      prescribed_architecture_or_documentation_style: false
      must_complete_required_experiment: true

    data:
      required: true
      role: experimental_inputs_outputs_and_artifacts

      conventional_subdirectories:
        - raw
        - tables
        - checkpoints
        - logs
        - figures

todo_authoring:
  current_action_only: true
  valid_markdown_required: true
  math_delimiter: inline_single_dollar_same_line
  speculative_requirements_forbidden: true
  quality_checks_require_scientific_risk_or_evidence_basis: true
  progress_or_obsolete_design_narrative_forbidden: true
  candidate_range_allowed_when_selection_is_current_work: true
  unverified_parameter_cannot_be_fixed_downstream: true

  revision:
    explicit_human_approval_for_scientific_change: true
    in_place_allowed_until_governed_figures_presented: true
    versioned_todo_required_after_governed_figures_presented: true
    versioned_todo_reuses_current_code_data_and_artifacts: true
    path_updates_remain_in_place: true
    fingerprint_refresh_required: true
    task_state_revision_increment_required: true
    pending_decision_invalidated: true

  verified_parameter_rewrite:
    complete_evidence_required: true
    explicit_human_selection_required: true
    in_place_before_figure_presentation: true
    preserve_candidate_and_sensitivity_evidence_outside_todo: true

implementation:
  principle:
    - make_it_work
    - make_it_right
    - make_it_fast

  non_plotting_default_language: matlab
  python_non_plotting_requires_documented_exception: true
  plotting_language: python
  plotting_artifact: py_script
  computation_and_plotting_files_separate: true
  reference_implementation_required_before_optimization: true
  numerical_and_scientific_equivalence_required: true

  fast_benchmark:
    scale: representative_medium
    fixed_setup_warmup_serialization_and_io_must_not_dominate: true
    dataset_size_and_fixed_costs_recorded: true
    larger_scale_check_when_batch_scaling_can_change_conclusion: true

  matlab_optimization_methods_to_consider:
    - redundant_computation_elimination
    - algorithmic_complexity
    - memory_layout_and_preallocation
    - vectorization_and_jit_friendly_code
    - optimized_builtins_and_toolboxes
    - mex_or_generated_code
    - parallel_computing
    - gpu_acceleration
    - bulk_io_and_partitioning

debugging:
  in_place_code_and_data_updates_allowed_in:
    - development
    - pilot
    - confirmation

  separate_debug_directories_required: false
  invalid_artifact_deletion_requires_reason_and_stable_ids: true
  dependent_derived_artifacts_regenerated: true
  valid_observations_preserved: true
  result_direction_never_justifies_deletion: true

transitions:
  prepare_decision_at_each_stage_boundary: true
  separate_evaluate_stage: false
  self_transition_required_for_every_state: true
  explicit_human_confirmation_required: true
  confirmation_authorizes_target_execution: true
  selected_rule_path_must_be_eligible: true
  target_only_confirmation_requires_unique_rule: true
  atomic_state_write_required: true
  revision_rule_set_and_todo_fingerprint_match_required: true
  preserve_decision_snapshot_in_history: true
  combined_figure_review_state: true

resources:
  default_limits:
    cpu_cores_fraction: 0.50
    system_memory_fraction: 0.50
    gpu_memory_per_device_fraction: 0.50

  derive_parallelism_from_measured_single_task_peak: true
  optimization_must_preserve_scientific_semantics: true

long_running_jobs:
  user_handoff_when_estimated_minimum_runtime_exceeds_minutes: 60
  codex_launch_forbidden_after_handoff_threshold: true
  require_representative_preflight: true
  require_batching_when_multiple_units: true
  require_checkpoint: true
  require_progress_reporting: true
  require_file_logging: true
  require_reproducible_script_or_command: true

experiments:
  default_repeats_when_random_and_unspecified: 3
  preserve_failed_missing_and_incomplete_runs: true
  aggregate_over_independent_repeats: true
  condition_merged_table_required: true

  nonstandard_parameters:
    measurable_selection_criterion_required: true
    sensitivity_exploration_required: true
    sensitivity_figure_required: true

analysis_validation:
  controlling_source_order:
    - todo_scientific_definition
    - task_state_and_frozen_task_manifest
    - raw_result_index_and_valid_raw_outputs
    - derived_aggregate_tables

  source_conflict_or_incompatible_grain_blocks: true
  aggregation_validation_filename: aggregation-validation.json

  core_checks:
    - intended_analysis_grain
    - schema_and_types
    - stable_keys_duplicates_and_missing_keys
    - run_status_counts
    - value_ranges
    - time_coverage_and_timezone_when_applicable
    - declared_and_observed_join_cardinality

  risk_driven_checks:
    - join_expansion
    - denominator_consistency
    - average_of_averages
    - incomplete_comparison_windows
    - selection_bias
    - outlier_influence

  mechanically_running_irrelevant_checks_forbidden: true
  blocking_findings_prevent_publication: true

io:
  preferred_tabular_format: parquet
  row_wise_result_table_updates_forbidden: true
  buffered_or_chunked_result_writes_required: true
  per_worker_output_isolation_preferred: true
  atomic_publish_required: true
  preflight_io_measurement_when_material: true

figures:
  planning_and_researcher_feedback_state: figure_review
  final_production_state: figure_production
  durable_render_source: executed_python_script
  plotting_script_separate_from_computation: true
  figure_script_validator: skills/research-figure-production/scripts/validate_figure_script.py
  planning_script_validation_filename: plot-script-validation.json
  final_script_validation_belongs_in_integrity_audit: true
  required_plot_style_package: SciencePlots
  required_plot_style_base: science

  default_plot_style_stack:
    - science
    - no-latex

  script_may:
    - read_complete_sources
    - validate_complete_sources
    - sort_for_presentation
    - pivot_or_reshape_for_presentation

  script_may_not_be_sole_implementation_of:
    - production_preprocessing
    - metric_computation
    - statistical_testing
    - model_fitting
    - exclusion_rules
    - aggregation

  required_manifest_fields:
    - plotting_script_sha256
    - input_sha256
    - output_sha256
    - todo_fingerprint
    - task_state_revision
    - git_revision
    - package_versions
    - execution_command
    - execution_started_at_utc
    - execution_finished_at_utc
    - data_quality_results
    - figure_data_sufficiency
    - style_stack

  allowed_complete_source_classes:
    - raw_computation_results
    - condition_merged_tables
    - validated_curated_tables

  all_applicable_conditions_accounted_for: true
  applicable_sensitivity_results_plotted: true
  paper_or_established_convention_basis_required: true
  researcher_feedback_required_before_final_production: true
  generalized_diagrams_labeled_schematic: true
  generalized_diagrams_cannot_replace_data_figures: true
  final_integrity_audit_required: true
  plotting_script_directory_pattern: "{todo_id}/exp/figures"
  figure_artifact_directory_pattern: "{todo_id}/data/figures"
  additional_markdown_handoff_forbidden: true

communication:
  prefer_established_technical_terms: true
  evaluative_adjectives_require_explicit_criteria: true
  separate_facts_interpretation_predicates_and_recommendations: true
  concise_direct_style_required: true
  examples_used_sparingly: true

artifacts:
  todo_template: .research/templates/TODO.md
  task_state_template: .research/templates/task-state.yaml
  pipeline: .research/workflow/pipeline.yaml
  state_machine: .research/workflow/state-machine.yaml
